name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install CI runner dependencies
        run: python -m pip install click rich python-dotenv

      # .env is git-ignored but required by docker-compose.yaml (env_file).
      - name: Create .env
        run: |
          cat > .env <<'ENV'
          SYSTEM_TIMEZONE=UTC
          PHP_XDEBUG_ENABLE=0
          PHP_XDEBUG_MODE=off
          PHP_XDEBUG_REMOTE_PORT=9003
          PHP_XDEBUG_IDEKEY=PHPSTORM
          PHP_XDEBUG_REMOTE_ADDRESS=host.docker.internal
          PHP_IDE_CONFIG=serverName=localhost
          ENV

      - name: Run checks (composer, phpunit, phpstan, psalm, rector, php-cs-fixer)
        env:
          PHP_VERSION: ${{ matrix.php }}
        run: python bin/ci.py --verbose
