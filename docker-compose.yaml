services:

      php_access:
        restart: on-failure
        build:
            context: .
            dockerfile: ./docker/php/Dockerfile
            args:
                PHP_VERSION:                ${PHP_VERSION:-8.4}
                SYSTEM_TIMEZONE:            ${SYSTEM_TIMEZONE}
                PHP_XDEBUG_ENABLE:          ${PHP_XDEBUG_ENABLE}
                PHP_XDEBUG_MODE:            ${PHP_XDEBUG_MODE}
                PHP_XDEBUG_REMOTE_PORT:     ${PHP_XDEBUG_REMOTE_PORT}
                PHP_XDEBUG_REMOTE_ADDRESS:  ${PHP_XDEBUG_REMOTE_ADDRESS}
                PHP_XDEBUG_IDEKEY:          ${PHP_XDEBUG_IDEKEY}
                UID:                        ${HOST_UID:-1000}
                GID:                        ${HOST_GID:-1000}
        extra_hosts:
            - host.docker.internal:host-gateway
        env_file:
            - .env
        container_name: php_access
        hostname: php_access
        volumes:
          - ./:/www
        working_dir: /www
        expose:
          - "9000"
        networks:
            - docker-core-php_access

networks:
    docker-core-php_access:
